services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hcc_auth
      POSTGRES_USER: hcc_auth
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hcc_auth}
    ports:
      - "5434:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcc_auth -d hcc_auth"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  auth_pg_data:
