services:
  postgres:
    image: postgres:17.6-alpine
    container_name: postgres-auth-service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hcc_auth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hcc_auth}
      POSTGRES_DB: ${DB_NAME:-hcc_auth}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hcc_auth} -d ${POSTGRES_DB:-hcc_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  auth_pg_data:
    driver: local
