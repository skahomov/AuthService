server.port=8081
spring.application.name=auth-service
server.servlet.session.cookie.name=AUTHSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=5m

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/hcc_auth}
spring.datasource.username=${DB_USER:hcc_auth}
spring.datasource.password=${DB_PASSWORD:hcc_auth}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

auth.jwt.issuer=${AUTH_ISSUER_URI:http://localhost:8081}
auth.jwt.audience=${AUTH_AUDIENCE:hcc-logic-service}
auth.jwt.ttl-seconds=${AUTH_TOKEN_TTL_SECONDS:900}
auth.jwt.key-file=${AUTH_SIGNING_KEY_FILE:./.local/auth-signing-keys.json}
auth.jwt.active-kid=${AUTH_ACTIVE_KID:}
auth.seed-demo-users=${AUTH_SEED_DEMO_USERS:true}

